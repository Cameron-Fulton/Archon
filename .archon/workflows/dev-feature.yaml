name: dev-feature
description: |
  Use when: A vertical-slice task is ready to execute (DB → API → UI, ~100K tokens).
  Input: $ARGUMENTS in the form `[prd: <id>] <task description>` or just `<task description>`.
  Does: Full execution pipeline — research → design → plan → build → review → ship.
        15 nodes, 3 approval gates (research, design, plan). Always runs in an
        isolated git worktree. Tests are written first (TDD), the E2E spec from
        the PRD is executed in a real browser, and security findings are
        appended to INCIDENT-LOG.md exactly once at the end.
  NOT for: Discovery (use dev-idea), small one-off fixes (use dev-feature-quick),
           or rapid bug fixes that skip the gates (use dev-feature-fix).

provider: claude
interactive: true

worktree:
  enabled: true

nodes:
  # ─── 1. Research ────────────────────────────────────────────────────
  - id: research
    command: dev-research
    model: sonnet
    context: fresh

  # ─── 2. Research gate ───────────────────────────────────────────────
  - id: research-gate
    depends_on: [research]
    approval:
      message: |
        Research complete. Read `$ARTIFACTS_DIR/research.md` before approving.
        Approve to proceed to design, or reject to abandon the task.

  # ─── 3. Design ──────────────────────────────────────────────────────
  - id: design
    command: dev-design
    depends_on: [research-gate]
    model: opus
    context: fresh

  # ─── 4. Design gate ─────────────────────────────────────────────────
  - id: design-gate
    depends_on: [design]
    approval:
      message: |
        Design artifacts ready in `$ARTIFACTS_DIR/`. Review the discovery log
        and any HTML mockups / Mermaid diagrams. Approve to plan implementation,
        or leave a comment that the planner should incorporate.
      capture_response: true

  # ─── 5. Plan ────────────────────────────────────────────────────────
  - id: plan
    command: dev-plan
    depends_on: [design-gate]
    model: opus
    context: fresh

  # ─── 6. Plan review (adversarial) ───────────────────────────────────
  - id: plan-review
    command: dev-plan-review
    depends_on: [plan]
    model: sonnet
    context: fresh

  # ─── 7. Plan gate ───────────────────────────────────────────────────
  - id: plan-gate
    depends_on: [plan-review]
    approval:
      message: |
        Plan reviewed and amended. Read `$ARTIFACTS_DIR/plan-amended.md` and
        the correction list in `$ARTIFACTS_DIR/plan-review.md`. Approve to
        build, or leave guidance for the build agent.
      capture_response: true

  # ─── 8. Build (TDD-bound) ───────────────────────────────────────────
  - id: build
    command: dev-build
    depends_on: [plan-gate]
    model: opus
    context: fresh
    skills:
      - superpowers:test-driven-development

  # ─── 9. Backend review (data path validation) ───────────────────────
  - id: review-backend
    command: dev-review-backend
    depends_on: [build]
    model: opus
    context: fresh

  # ─── 10. Frontend review (E2E in real browser) ──────────────────────
  - id: review-frontend
    command: dev-review-frontend
    depends_on: [build]
    model: opus
    context: fresh

  # ─── 11. Simplify ───────────────────────────────────────────────────
  - id: simplify
    command: dev-simplify
    depends_on: [review-backend, review-frontend]
    trigger_rule: all_done
    model: sonnet
    context: fresh

  # ─── 12. Harden (test gap fill, refactor, librarian intake) ─────────
  - id: harden
    command: dev-harden
    depends_on: [simplify]
    model: opus
    context: fresh

  # ─── 13. Security (writes findings to artifacts only) ───────────────
  - id: security
    command: dev-security
    depends_on: [harden]
    model: opus
    context: fresh

  # ─── 14. Commit (/done-gate then /gate then commit) ─────────────────
  - id: commit
    command: dev-commit
    depends_on: [security]
    model: haiku
    context: fresh

  # ─── 15. Update KB (memento + librarian + INCIDENT-LOG append) ──────
  - id: update-kb
    command: dev-update-kb
    depends_on: [commit]
    model: haiku
    context: fresh

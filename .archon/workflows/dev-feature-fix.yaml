name: dev-feature-fix
description: |
  Use when: A bug fix where research/design/plan are needed but the human shouldn't
  have to babysit 3 approval gates.
  Triggers: tasks with `[skip: Research, Design, Plan]` in the title, OR `[skip: gates]`,
           OR fixes that already have a clear root cause from a prior triage.
  Does: research → design → plan → plan-review → build → review-backend & review-frontend →
        simplify → harden → security → commit → update-kb. ALL 3 approval gates removed.
  NOT for: anything that needs human-in-the-loop sign-off (use dev-feature),
           true one-off fixes (use dev-feature-quick).

provider: claude
interactive: false

worktree:
  enabled: true

nodes:
  - id: research
    command: dev-research
    model: sonnet
    context: fresh

  - id: design
    command: dev-design
    depends_on: [research]
    model: opus
    context: fresh

  - id: plan
    command: dev-plan
    depends_on: [design]
    model: opus
    context: fresh

  - id: plan-review
    command: dev-plan-review
    depends_on: [plan]
    model: sonnet
    context: fresh

  - id: build
    command: dev-build
    depends_on: [plan-review]
    model: opus
    context: fresh
    skills:
      - superpowers:test-driven-development

  - id: review-backend
    command: dev-review-backend
    depends_on: [build]
    model: opus
    context: fresh

  - id: review-frontend
    command: dev-review-frontend
    depends_on: [build]
    model: opus
    context: fresh

  - id: simplify
    command: dev-simplify
    depends_on: [review-backend, review-frontend]
    trigger_rule: all_done
    model: sonnet
    context: fresh

  - id: harden
    command: dev-harden
    depends_on: [simplify]
    model: opus
    context: fresh

  - id: security
    command: dev-security
    depends_on: [harden]
    model: opus
    context: fresh

  - id: commit
    command: dev-commit
    depends_on: [security]
    model: haiku
    context: fresh

  - id: update-kb
    command: dev-update-kb
    depends_on: [commit]
    model: haiku
    context: fresh

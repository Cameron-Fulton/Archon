name: dev-idea
description: |
  Use when: A new feature idea needs shaping before it enters the execution pipeline.
  Triggers: human-only — `archon workflow run dev-idea --cwd D:/projects/<project> "<idea>"`.
            The dispatcher does NOT auto-dispatch this workflow.
  Does: grill the idea → research ICP + competitors → write PRD with mandatory E2E test
        → adversarial PRD review → decompose into vertical-slice Kanban tasks (POST /api/tasks).
  Output: one Kanban task per vertical slice in the `Ready` column, all with `prd_id` set.
  NOT for: executing work (use dev-feature), small fixes (use dev-feature-quick).

provider: claude
interactive: true

worktree:
  enabled: false

nodes:
  # ─── 1. Grill ───────────────────────────────────────────────────────
  - id: grill
    command: dev-grill
    model: sonnet
    context: fresh

  # ─── 2. Grill gate ──────────────────────────────────────────────────
  - id: grill-gate
    depends_on: [grill]
    approval:
      message: |
        Idea grilled — read `$ARTIFACTS_DIR/grill.md` (in particular the verdict).
        Approve to spend ICP-research + PRD cycles, or reject to abandon.

  # ─── 3. ICP research ────────────────────────────────────────────────
  - id: icp-research
    command: dev-icp-research
    depends_on: [grill-gate]
    model: sonnet
    context: fresh

  # ─── 4. PRD ─────────────────────────────────────────────────────────
  - id: prd
    command: dev-prd
    depends_on: [icp-research]
    model: opus
    context: fresh

  # ─── 5. PRD review (adversarial) ────────────────────────────────────
  - id: prd-review
    command: dev-prd-review
    depends_on: [prd]
    model: sonnet
    context: fresh

  # ─── 6. PRD gate ────────────────────────────────────────────────────
  - id: prd-gate
    depends_on: [prd-review]
    approval:
      message: |
        PRD reviewed. Read `$(pwd)/lifecycle/prds/$WORKFLOW_ID/prd-amended.md`
        (falls back to prd.md if no amendment) and `$ARTIFACTS_DIR/prd-review.md`.
        Approve to decompose into Kanban tasks, or leave guidance for the slicer.
      capture_response: true

  # ─── 7. Slice → POST /api/tasks per vertical slice ──────────────────
  - id: slice
    command: dev-slice
    depends_on: [prd-gate]
    model: haiku
    context: fresh
